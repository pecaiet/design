<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--background); }
  .pv { display: grid; grid-template-columns: 1fr 1fr; }
  .pv-panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; padding: 20px 24px 28px; }
  .pv-mode { color: var(--muted-foreground); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .pv-sec { display: grid; gap: 10px; }
  .pv-cap { color: var(--muted-foreground); font-size: 12px; line-height: 1.4; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .pv-list { display: grid; grid-template-columns: 240px 1fr; align-items: center; column-gap: 16px; }
  .pv-list.wide { grid-template-columns: 340px 1fr; }
  .pv-strip { padding: 2px 8px; background: var(--sidebar); }
  .pv-strip.first { padding-top: 10px; border-radius: 14px 14px 0 0; }
  .pv-strip.last { padding-bottom: 10px; border-radius: 0 0 14px 14px; }
  .pv-list .pv-cap { padding: 4px 0; }
  .pv-stack { display: grid; gap: 14px; max-width: 420px; }
  .pv-backdrop { display: grid; place-items: center; padding: 28px 16px; border-radius: 14px; background: var(--overlay); }
  .pv-tipzone { padding-top: 44px; }
  .phone { position: relative; height: 440px; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--background); }
  .force-hover.pc-sidebar-item { background: var(--sidebar-hover); }
  .force-hover.pc-btn-primary { background: var(--primary-hover); border-color: var(--primary-hover); }
  .force-hover.pc-btn-outline, .force-hover.pc-btn-ghost, .force-hover.pc-menu-item, .force-hover.pc-task, tr.force-hover { background: var(--accent); color: var(--foreground); }
  .force-hover.pc-btn-destructive { background: var(--destructive-soft); }
  .force-hover.pc-link { text-decoration-color: var(--primary); }
  .force-hover.pc-tab { color: var(--foreground); }
  .force-focus { outline: 2px solid transparent; outline-offset: 1px; box-shadow: inset 0 0 0 1px var(--background), var(--pc-focus); }
  .force-focus.pc-btn, .force-focus.pc-input, .force-focus.pc-textarea, .pc-select > .force-focus, .force-focus.pc-checkbox, .force-focus.pc-radio { border-color: var(--background); box-shadow: var(--pc-focus); }
  .force-focus.pc-sidebar-item, .force-focus.pc-menu-item, .force-focus.pc-search-result, .force-focus.pc-calendar-day, tr.force-focus { box-shadow: var(--pc-focus-inset); }
  .force-focus.pc-menu-item { background: var(--accent); }
  .force-focus.pc-sidebar-item { background: var(--sidebar-hover); }
  .force-focus.pc-sidebar-item[aria-current="page"] { background: var(--sidebar-active); }
  .force-tip[data-pc-tooltip]::after { opacity: 1; }
</style>
</head>
<body>
<div class="pv"><div class="ui pv-panel" data-theme="senin-light"><div class="pv-mode">Light</div><div class="pv-stack"><div class="pv-sec"><div class="pv-cap">One of a few (when a reminder goes off).</div><div style="display:grid;gap:10px"><div class="pc-field" style="gap:2px"><label class="pc-check" for="r1-light"><input class="pc-radio" type="radio" name="g-light-r1" id="r1-light" checked><span>On the day</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="r2-light"><input class="pc-radio" type="radio" name="g-light-r2" id="r2-light"><span>1 day before</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="r3-light"><input class="pc-radio" type="radio" name="g-light-r3" id="r3-light"><span>1 week before</span></label></div></div></div><div class="pv-sec"><div class="pv-cap">Keyboard focus and disabled.</div><div style="display:grid;gap:10px"><div class="pc-field" style="gap:2px"><label class="pc-check" for="s1-light"><input class="pc-radio force-focus" type="radio" name="g-light-s1" id="s1-light"><span>At a time</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="s2-light"><input class="pc-radio" type="radio" name="g-light-s2" id="s2-light" disabled><span>When I arrive</span></label><p class="pc-field-hint" style="padding-left:26px">Needs location access.</p></div></div></div></div></div><div class="ui pv-panel" data-theme="senin-dark"><div class="pv-mode">Dark</div><div class="pv-stack"><div class="pv-sec"><div class="pv-cap">One of a few (when a reminder goes off).</div><div style="display:grid;gap:10px"><div class="pc-field" style="gap:2px"><label class="pc-check" for="r1-dark"><input class="pc-radio" type="radio" name="g-dark-r1" id="r1-dark" checked><span>On the day</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="r2-dark"><input class="pc-radio" type="radio" name="g-dark-r2" id="r2-dark"><span>1 day before</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="r3-dark"><input class="pc-radio" type="radio" name="g-dark-r3" id="r3-dark"><span>1 week before</span></label></div></div></div><div class="pv-sec"><div class="pv-cap">Keyboard focus and disabled.</div><div style="display:grid;gap:10px"><div class="pc-field" style="gap:2px"><label class="pc-check" for="s1-dark"><input class="pc-radio force-focus" type="radio" name="g-dark-s1" id="s1-dark"><span>At a time</span></label></div><div class="pc-field" style="gap:2px"><label class="pc-check" for="s2-dark"><input class="pc-radio" type="radio" name="g-dark-s2" id="s2-dark" disabled><span>When I arrive</span></label><p class="pc-field-hint" style="padding-left:26px">Needs location access.</p></div></div></div></div></div></div>
</body>
</html>
